<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ahmed Mahmoud — graphic designer and video editor. Visual identities, social campaigns, and cinematic edits."
    />
    <meta name="theme-color" content="#050509" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;600;700&family=Manrope:wght@400;500;600&family=Sora:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Ahmed Mahmoud — Graphic Designer &amp; Video Editor</title>
    <script>
      try {
        var theme = localStorage.getItem("theme") || "dark"
        var lang = localStorage.getItem("lang") || "en"
        var root = document.documentElement
        root.dataset.theme = theme
        root.lang = lang
        root.dir = lang === "ar" ? "rtl" : "ltr"
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
